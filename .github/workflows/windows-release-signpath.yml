name: Build and sign Windows portable release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-and-sign:
    # This workflow is limited to main; configure SignPath origin verification to require main as well.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Windows portable executable
        run: npm run dist:portable

      - name: Upload unsigned executable for SignPath origin verification
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-portable
          path: release-final/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Submit signing request to SignPath
        id: sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify signed executable
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath 'signed' -Filter '*.exe' -File -Recurse)
          if ($files.Count -ne 1) {
            throw "Expected exactly one signed EXE, found $($files.Count)."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "Verified signed executable: $($files[0].Name)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

      - name: Upload verified signed executable
        uses: actions/upload-artifact@v7
        with:
          name: signed-windows-portable
          path: signed/**
          if-no-files-found: error
          retention-days: 30
